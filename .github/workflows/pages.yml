name: Deploy demo

# Builds the browser demo and puts it on GitHub Pages.
# One time setup: repo Settings, Pages, set Source to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No API url, so the site runs in demo mode. The base path matches the repo name.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /wheels-in
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
      - id: deployment
        uses: actions/deploy-pages@v4
