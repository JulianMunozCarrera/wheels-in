name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The server tests need a real Postgres and a real Redis.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wheels
          POSTGRES_PASSWORD: wheels
          POSTGRES_DB: wheels
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wheels" --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://wheels:wheels@localhost:5432/wheels
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
